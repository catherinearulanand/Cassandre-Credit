id: policy.review_calendar
version: 2026.10.0
status: unverified
effective_from: 2026-04-01
source:
  title: "Periodic credit review frequency (bank policy, placeholder parameters)"
  url: null
  source_note: "Illustrative. Replace with the board-approved credit policy review cadence."
rules:
