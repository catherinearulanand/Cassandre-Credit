  - { input: { first_default_on: 2026-01-01, today: 2026-08-01 }, expect: { review_period_end: 2026-01-31, resolution_deadline: 2026-07-30, additional_provision_pct: "20" } }
  - { input: { first_default_on: 2026-01-01, today: 2027-03-01 }, expect: { review_period_end: 2026-01-31, resolution_deadline: 2026-07-30, additional_provision_pct: "35" } }
