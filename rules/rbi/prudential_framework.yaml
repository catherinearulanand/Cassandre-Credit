source:
  title: "Prudential Framework for Resolution of Stressed Assets (7 Jun 2019)"
  date: 2019-06-07
  url: null
  source_note: "30-day review; RP within 180 days of review end; +20% after 180, further +15% after 365. [VERIFY]"
rules:
