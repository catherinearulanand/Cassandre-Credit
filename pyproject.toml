[project]
name = "credit-platform"
version = "0.1.0"
description = "Corporate Credit Lifecycle Platform: post-sanction intelligence, control and workflow layer around Finacle"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8", "pydantic-settings>=2.4", "lark>=1.2", "pyyaml>=6", "fastapi>=0.115",
  "uvicorn>=0.30", "httpx>=0.27", "numpy>=2", "pandas>=2.2", "scikit-learn>=1.5",
  "lightgbm>=4.5", "shap>=0.46", "pillow>=10", "rapidfuzz>=3.9", "python-ulid>=3",
  "cryptography>=43", "opencv-python-headless>=4.10", "rapidocr-onnxruntime>=1.3", "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs", "services", "simulators", "ocr", "ml", "agents", "sim"]

[tool.hatch.build]
dev-mode-dirs = ["libs", "services", "simulators", "."]

[tool.pytest.ini_options]
pythonpath = ["libs", "services", "simulators", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:LightGBM binary classifier:UserWarning", "ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning", "ignore::UserWarning:shap.*"]
markers = [
  "slow: long-running (OCR, ML training, load tests)",
  "golden: golden-set evaluations",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "N", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "N818", "UP040", "UP046", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "N802", "N806", "E501", "RUF059", "SIM105"]
"simulators/**" = ["S311"]
"services/finacle_adapter/adapter.py" = ["S311"]
"tools/**" = ["S603"]
"sim/**" = ["S311"]
"ocr/**" = ["S311", "S324"]
"libs/testing/**" = ["S311"]
"ocr/synthetic/**" = ["S311"]
"ml/**" = ["S311", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["libs", "services", "simulators", "."]
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ['^tests/', '^[.]venv/']

[[tool.mypy.overrides]]
module = ["ml.*", "ocr.eval.*", "sim.*", "ocr.pipeline.route"]
disallow_untyped_calls = false
warn_return_any = false
